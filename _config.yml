    url: https://github.com/curiousML
  - name: LinkedIn
    icon: linkedin
    url: https://www.linkedin.com/in/fran%C3%A7ois-hu-9b6295136/
  - name: arXiv
    icon: arxiv
    url: https://arxiv.org/a/hu_f_1
  - name: Demythified
    icon: youtube
    url: https://www.youtube.com/@DemythifiedMyths
  - name: Curious Machine Learning
    icon: youtube
    url: https://www.youtube.com/@curiousmachinelearning7291
  - name: Email
    icon: mail
    url: mailto:hu.faugon@gmail.com

# ---------------------------------------------------------------------------
#  Navigation
# ---------------------------------------------------------------------------
nav:
  - title: Research
    url: /research/
  - title: Teaching
    url: /teaching/
  - title: Projects
    url: /projects/
  - title: Blog
    url: /blog/
  - title: Experience
    url: /experience/
  - title: Recommendations
    url: /recommendations/

# ---------------------------------------------------------------------------
#  Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /blog/:title/
timezone: Europe/Paris

# ---------------------------------------------------------------------------
#  Blog subjects
# ---------------------------------------------------------------------------
# One per post, declared as `category:` in the post's front matter. This list
# fixes the wording and the order of the filter buttons on /blog/; a subject
# with no posts simply does not get a button. Keep the vocabulary short: the
# filter stops being useful once the categories overlap. Free-form `tags:`
# handle everything finer-grained.
blog_categories:
  - Machine learning
  - NLP & LLMs
  - Trustworthy AI
  - Insurance
  - Dev
  - Other

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: /feed.xml

google_analytics: UA-163147530-1

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .DS_Store
  - "**/.ipynb_checkpoints"
  - "**/.DS_Store"
  - "**/DRAFT"
  - "**/*.pptx"
