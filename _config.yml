# ---------------------------------------------------------------------------
#  Site
# ---------------------------------------------------------------------------
title: François HU
tagline: Associate Professor & AI Researcher
description: >-
  Personal site of François HU, Associate Professor in AI and Actuarial Science
  at ISFA, Université Claude Bernard Lyon 1, and Head of the R&D AI Lab at
  Milliman France. Research on trustworthy AI, algorithmic fairness, and
  statistical learning for insurance and finance.
url: https://curiousml.github.io
baseurl: ""
lang: en

# ---------------------------------------------------------------------------
#  Author / identity
# ---------------------------------------------------------------------------
author:
  name: François HU
  short_name: François
  role: Associate Professor & AI Researcher
  affiliation: ISFA, Université Claude Bernard Lyon 1
  affiliation_2: R&D AI Lab, Milliman France
  location: Paris, France
  photo: /images/photo_FH.png
  avatar: /images/francois_HU.jpeg
  cv: /cv/cv_hu.pdf
  # My own YouTube channels, rendered in the "Mine" block on /recommendations/.
  # The page loops over this list, so adding a third channel is a data edit and
  # needs no template change. Order here is the display order. Check the @handle
  # resolves before committing: a wrong one is a silent 404.
  channels:
    - name: Demythified
      url: https://www.youtube.com/@DemythifiedMyths
      note: >-
        Myths and legends from around the world, retold as animated short films.
        A hobby, with nothing to do with the research, and that is rather the
        point.
    - name: Curious Machine Learning
      url: https://www.youtube.com/@curiousmachinelearning7291
      note: >-
        Expect a simplified overview of AI, of insurance, and of the ground
        where the two meet: the same subjects as the research and the teaching,
        without the notation. Newly started, one video so far.
  email: hu.faugon@gmail.com
  bio: >-
    I am Associate Professor in AI and Actuarial Science at ISFA, Université
    Claude Bernard Lyon 1, and I lead the R&D AI Lab at Milliman France. My work
    sits at the intersection of statistical learning and trustworthy AI
    (fairness, interpretability, privacy), mostly applied to insurance and
    finance. I also teach at EPITA, Cnam and the Institut des Actuaires.

# Order matters: this drives the "Elsewhere" lists and the footer.
